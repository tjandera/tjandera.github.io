<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tjandera.github.io</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    main {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 2px solid #222;
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.4;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li + li {
      margin-top: 12px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 2px solid #222;
      background: #eee;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #222;
      color: #fff;
    }

    a span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: normal;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>tjandera.github.io</h1>
    <p>Pick a page to open:</p>
    <ul>
      <li>
        <a href="challenge1.html">
          Challenge 1
          <span>challenge1.html</span>
        </a>
      </li>
      <li>
        <a href="challenge2.html">
          Challenge 2
          <span>challenge2.html</span>
        </a>
      </li>
      <li>
        <a href="challenge3.html">
          Challenge 3
          <span>challenge3.html</span>
        </a>
      </li>
      <li>
        <a href="celebrity.html">
          Celebrity page
          <span>Inde Navarrette fan page</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
