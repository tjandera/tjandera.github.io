<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tjandera.github.io</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    main {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 2px solid #222;
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 14px 16px;
      border: 2px solid #222;
      background: #eee;
      color: #222;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .links a:hover,
    .links a:focus {
      background: #222;
      color: #fff;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>tjandera.github.io</h1>
    <p>Pick a page to open:</p>
    <div class="links">
      <a href="/challenge1.html">Challenge 1</a>
      <a href="/challenge2.html">Challenge 2</a>
      <a href="/challenge3.html">Challenge 3</a>
      <a href="/celebrity.html">Celebrity page</a>
    </div>
  </main>
</body>
</html>
